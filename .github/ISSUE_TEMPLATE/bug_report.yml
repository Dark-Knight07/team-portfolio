name: Bug report
description: Something is broken or behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic)
        - Medium (feature impaired)
        - High (feature broken)
        - Critical (production down, use a hotfix)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Never paste secrets, tokens or passwords.
